name: Daily Paper Radar

'on':
  workflow_dispatch:
  schedule:
    # UTC 00:17 = 北京时间 08:17；GitHub 调度可能延迟。
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths:
      - 'radar/**'
      - 'web/**'
      - 'tests/**'
      - 'run.py'
      - 'config.yaml'
      - 'overrides.yaml'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'

permissions:
  contents: read

concurrency:
  group: paper-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      collection: ${{ steps.collect.outcome }}
      archive: ${{ steps.archive.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Collect paper metadata
        id: collect
        timeout-minutes: 45
        continue-on-error: true
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python run.py
      - name: Build from the production archive, never from preview data
        run: |
          python run.py --build-only
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('site/papers.json').read_text(encoding='utf-8'))
          assert payload['meta']['mode'] == 'live', 'Refusing to deploy preview data'
          PY
      - name: Persist archive and source status
        id: archive
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/store.json data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update paper metadata and source health'
            # Preserve concurrent user edits; never force-push.
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              exit 1
            fi
            git push origin HEAD:main
          fi
      - name: Collection summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads(Path('site/papers.json').read_text(encoding='utf-8'))['meta']
          counts = {}
          for item in state.get('sources', {}).values():
              status = item.get('status', 'unknown')
              counts[status] = counts.get(status, 0) + 1
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Paper Radar collection\n\n')
              f.write(f"Records displayed: {state['displayed']}\n\n")
              f.write('Source states: ' + ', '.join(f'{k}: {v}' for k, v in counts.items()) + '\n\n')
              f.write('Page deployment and source availability are checked separately. See the website source-status panel.\n')
          PY
      - name: Package website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  source-health:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report collection or persistence failures after deployment
        env:
          COLLECTION: ${{ needs.build.outputs.collection }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: |
          if [ "$COLLECTION" != success ] || [ "$ARCHIVE" != success ]; then
            echo '::error::Website deployed, but collection or archive persistence failed. Inspect build logs and source status.'
            exit 1
          fi
          echo 'Website deployed; no collection exceptions or archive persistence errors.'
